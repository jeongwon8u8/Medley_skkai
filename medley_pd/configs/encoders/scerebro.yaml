# frozen S-CEReBrO — pulp-bio/BioFoundation PR #18 (commit 361c017), Hugging Face PulpBio/S-CEReBrO
# 사전학습·Mumtaz 전처리와 같은 조건: 200 Hz, 1초 패치, 5초 구간, 0.3–75 Hz, 노치
name: scerebro
type: scerebro
fs: 200
seg_sec: 5
amp_div: 1.0                   # μV 그대로 두고, 인코더 안에서 구간·채널별 min-max [-1, 1] (eps 1e-6)
channels: [Fp1, Fp2, F7, F3, Fz, F4, F8, T7, C3, Cz, C4, T8, P7, P3, Pz, P4, P8, O1, O2]
repo: null                     # BioFoundation 클론 경로 (git checkout 361c017ce0018141391d068e85fd6352fa32a9ef)
weights: null                  # S_CEReBrO.safetensors 경로
reference: null                # 실행 때 dataset.reference 로 자동 채움 (기준전극 좌표)
pool: channel                  # channel: 패치 평균 후 펼침 (19×180 = 3,420차원) / mean: 전체 토큰 평균 (180차원)
batch_size: 64

# config/model/SCEReBrO_tiny.yaml 과 동일 (num_channels 는 channels 길이로 자동 설정)
arch:
  patch_size: 200
  embed_dim: 180
  depth: 6
  num_heads: 5
  mlp_ratio: 4.0
  attention_type: windowed-alternating
  drop_path: 0.1
  attn_drop: 0.1
  proj_drop: 0.1
  max_channels: 64
  max_timesteps: 6000
  window_size_spatial: 7
  window_size_temporal: 5
  dilation_cycle_spatial: [1, 2, 4]
  dilation_cycle_temporal: [1, 2, 4]
  shift_cycle_spatial: [-1, 1, -2, 2]
  shift_cycle_temporal: [-1, 1, -2, 2]
  use_axial_mode: false
